services:
  cadflux:
    build: .
    ports:
      - "8080:8080"
    environment:
      CADFLUX_HOST: 0.0.0.0
      CADFLUX_PORT: 8080
      CADFLUX_DATA_DIR: /app/data
      CADFLUX_DATABASE_PATH: /app/data/database/cadflux.sqlite
      CADFLUX_SESSION_SECRET: change-this-before-production
      CADFLUX_ADMIN_USERNAME: admin
      CADFLUX_ADMIN_PASSWORD: ChangeThisPassword123!
      CADFLUX_WORKER_CONCURRENCY: 1
      CADFLUX_CONVERSION_TIMEOUT_MS: 300000
    volumes:
      - cadflux-data:/app/data

volumes:
  cadflux-data:
